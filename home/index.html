:root{color-scheme:dark;--bg:#0a0f14;--card:#121a22;--card2:#18222c;--line:#223040;--ink:#f2f4f8;--mut:#b4bdca;
 --acc:#ffb23e;--acc2:#ff8a3d;--acc-ink:#1f1200;--acc-soft:#3a2a10;--acc-line:#a8741f;--acc-txt:#ffd28a;--ok:#3fd49a;--bad:#ff8fa3;--nav-h:64px}
*{box-sizing:border-box}
html{font-size:var(--ts,100%);-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--ink);font:400 1.0625rem/1.45 Rubik,system-ui,-apple-system,"Segoe UI",Arial,sans-serif;-webkit-font-smoothing:antialiased;-webkit-tap-highlight-color:transparent}
button,input,select{font:inherit;color:inherit}button{cursor:pointer;border:0;background:none;padding:0}button:disabled{opacity:.45;cursor:default}

.app{max-width:640px;margin:0 auto;min-height:100dvh;padding:calc(12px + env(safe-area-inset-top)) 16px calc(var(--nav-h) + 44px + env(safe-area-inset-bottom));background:radial-gradient(120% 50% at 100% 0,#3d2a0f66,transparent 60%)}
header.top{padding:4px 4px 0;margin-bottom:14px}
.brandRow{display:flex;align-items:center;justify-content:space-between;gap:10px}
.brand{display:flex;align-items:flex-end;gap:1px;font-size:1.5rem;font-weight:700;color:#fff3e0;line-height:1;letter-spacing:-.2px;direction:ltr}

.chip{flex:0 0 auto;min-height:44px;padding:0 16px;border-radius:999px;background:var(--card);border:1px solid var(--line);color:var(--mut);white-space:nowrap;font-weight:500}

.card.off-line{opacity:.7}
.card .open{position:absolute;inset:0;border-radius:21px}
.card .ic{width:44px;height:44px;border-radius:14px;background:var(--card2);border:1px solid var(--line);display:grid;place-items:center;color:var(--mut)}
.card.is-on .ic{color:var(--acc);border-color:var(--acc-line);background:var(--acc-soft)}
.card .ic svg{width:25px;height:25px}
.card .nm{font-weight:600;font-size:1.05rem;line-height:1.25;overflow-wrap:anywhere;margin-top:auto}
.card .st{color:var(--mut);font-size:.92rem}
.card.is-on .st{color:var(--acc-txt)}
.card .pw{position:absolute;top:10px;left:10px;width:52px;height:52px;border-radius:50%;background:#1a1f27;border:1px solid var(--line);display:grid;place-items:center;z-index:1;color:var(--mut)}
.card .pw[aria-checked="true"]{background:linear-gradient(160deg,var(--acc),var(--acc2));border-color:transparent;color:var(--acc-ink);box-shadow:0 4px 16px #ff9a3d40}

.sec-h{display:flex;align-items:center;justify-content:space-between;margin:22px 4px 10px;gap:10px}

.btn{min-height:50px;padding:0 18px;border-radius:16px;background:#1d2530;border:1px solid #34404f;color:#ffe9c7;font-weight:600;display:inline-flex;align-items:center;justify-content:center;gap:8px}
.btn svg{width:20px;height:20px}

.btn.wide{width:100%}
.btns{display:flex;gap:10px}.btns>.btn{flex:1}
.sw{width:56px;height:34px;border-radius:999px;background:#2a3644;position:relative;flex:none;transition:background .2s}
.sw::after{content:"";position:absolute;top:3px;right:3px;width:28px;height:28px;border-radius:50%;background:#fff;transition:transform .2s}
.sw[aria-checked="true"]{background:#2ea36f}.sw[aria-checked="true"]::after{transform:translateX(-22px)}

 background:linear-gradient(160deg,#4a4334b0,#1d1a14e0);border:1px solid #d6c39f4d;box-shadow:inset 0 1px 1.5px #ffffff40,0 14px 34px #000a;-webkit-backdrop-filter:blur(24px) saturate(160%);backdrop-filter:blur(24px) saturate(160%)}

.scrim{position:fixed;inset:0;z-index:30;display:flex;justify-content:center}
.sheet{width:100%;overflow-y:auto;overscroll-behavior:contain;background:radial-gradient(120% 40% at 50% 0,#2e2210,transparent 60%),var(--bg);padding:calc(10px + env(safe-area-inset-top)) 16px calc(32px + env(safe-area-inset-bottom));display:flex;flex-direction:column;gap:14px;animation:sheetIn .28s cubic-bezier(.2,.8,.2,1)}
.sheet>*{width:100%;max-width:608px;margin-inline:auto}

.sheet-h{display:flex;align-items:center;gap:10px}
.sheet-h h2{flex:1;margin:0;font-size:1.6rem;font-weight:700;letter-spacing:-.3px;overflow-wrap:anywhere;text-align:start}
.sheet>p{margin:0;color:var(--mut);line-height:1.6}
.field{display:flex;flex-direction:column;gap:6px}
.field label,.field>span{font-weight:600;color:var(--mut);font-size:.95rem}
.field input,.field select{min-height:52px;border-radius:14px;border:1px solid #48556b;background:#11161e;padding:0 14px;font-size:1.05rem}
.err{color:var(--bad);font-weight:600;min-height:1.2em}
.big-pw{align-self:center;width:136px!important;height:136px;border-radius:50%;background:#1a1f27;border:1px solid var(--line);display:grid;place-items:center;margin:8px auto 0;color:var(--mut);box-shadow:inset 0 1px 0 #ffffff12}

.state-line{text-align:center;font-weight:700;font-size:1.2rem}
.big-pw[aria-checked="true"]+.state-line{color:var(--acc-txt)}
.ctl{display:flex;flex-direction:column;gap:10px;padding:14px 16px;border-bottom:1px solid var(--line)}
.ctl:last-child{border-bottom:0}
.ctl-h{display:flex;align-items:center;justify-content:space-between;gap:12px;min-height:36px}
.ctl-h .t{font-weight:500;font-size:1.05rem}
.ctl-h .v{font-weight:700;font-variant-numeric:tabular-nums;color:var(--acc-txt)}
.seg{display:flex;flex-wrap:wrap;gap:6px;background:#0d141b;border:1px solid var(--line);border-radius:16px;padding:5px}

.seg button[aria-pressed="true"]{background:var(--acc-soft);color:#fff;box-shadow:inset 0 0 0 1px var(--acc-line)}
.step{display:flex;align-items:center;gap:10px;direction:ltr}
.step button{width:52px;height:52px;border-radius:50%;background:#1a1f27;border:1px solid var(--line);font-size:1.6rem;font-weight:700;flex:none}

.readouts{display:grid;grid-template-columns:repeat(auto-fill,minmax(130px,1fr));gap:10px}
.ro{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:12px 14px}
.ro .k{color:var(--mut);font-size:.88rem}.ro .n{font-size:1.4rem;font-weight:700;font-variant-numeric:tabular-nums}
.days{display:flex;gap:6px;flex-wrap:wrap}
.days button{width:48px;height:48px;border-radius:50%;background:var(--card);border:1px solid var(--line);font-weight:600;color:var(--mut)}

.toast{position:fixed;top:calc(env(safe-area-inset-top) + 12px);left:50%;transform:translateX(-50%);background:#1d2530;border:1px solid var(--acc-line);color:#fff;padding:12px 20px;border-radius:16px;font-weight:600;z-index:50;max-width:calc(100% - 32px);text-align:center;box-shadow:0 10px 30px #000a}
.qrbox{background:#fff;padding:12px;border-radius:18px;width:min(280px,100%)!important}
.qrbox svg{width:100%;height:auto;display:block}
ol{margin:0;padding-inline-start:22px;display:flex;flex-direction:column;gap:8px;line-height:1.55}
.splash{position:fixed;inset:0;z-index:100;background:var(--bg);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:22px;transition:opacity .4s ease}

@keyframes sin{from{opacity:0;transform:scale(.85)}to{opacity:1;transform:none}}
@keyframes r{to{transform:rotate(360deg)}}
@media (prefers-reduced-motion: reduce){*,*::before,*::after{animation:none!important;transition:none!important}}
@media (prefers-contrast: more){:root{--line:#7d8a9c;--mut:#e3e8ef}}

/* ---------- api ---------- */
async function api(path,body){
  let r;try{r=await fetch(CFG.api.replace(/\/$/,'')+path,{method:'POST',headers:Object.assign({'Content-Type':'application/json'},CFG.key?{'X-Kor-Key':CFG.key}:{}),body:JSON.stringify(body||{})})}
  catch(e){throw new Error('אין חיבור לאינטרנט')}
  let j;try{j=await r.json()}catch(e){throw new Error('השרת לא ענה ('+r.status+')')}
  if(r.status===401&&CFG.key&&!/^\/(share|recover|dev)/.test(path)){setKey('');render();openConnect();throw new Error(j.error||'החיבור פג')}

}

function roVal(d,f){const v=d.status[f.code];if(f.type==='Integer')return fmtNum(v,f);if(f.type==='Boolean')return v?'כן':'לא';return vname(v)}

  if(f.type==='Enum'){const r=(f.values&&f.values.range)||[];

   <button class="sw" role="switch" data-sen="${esc(s.id)}" aria-checked="${!!s.enabled}" aria-label="תזמון ${esc(s.time)} פעיל"></button></div>`}
function bindSchedRows(root){
  root.querySelectorAll('[data-se]').forEach(b=>b.onclick=()=>{const s=SCHED.find(x=>x.id===b.dataset.se);openSchedEdit(s,DEVS.find(x=>x.id===s.device))});

/* action picker - what to send: power on/off or any control value */
function actionEditor(d,cur){
  const fns=(d.functions||[]).filter(f=>!SKIP.has(f.code)&&['Boolean','Enum','Integer'].includes(f.type));
  const pc=powerCode(d);
  const opts=[];if(pc){opts.push({k:'on',t:'הדלקה',c:{code:pc,value:true}},{k:'off',t:'כיבוי',c:{code:pc,value:false}})}
  fns.filter(f=>f.code!==pc).forEach(f=>opts.push({k:'f:'+f.code,t:nameOf(f),f}));
  let sel=cur&&cur.code===pc?(cur.value?'on':'off'):cur?'f:'+cur.code:opts[0]?.k;
  const html=`<div class="field"><label for="actK">פעולה</label><select id="actK">${opts.map(o=>`<option value="${esc(o.k)}"${o.k===sel?' selected':''}>${esc(o.t)}</option>`).join('')}</select></div><div id="actV"></div>`;
  return {html,bind(el){
    const k=el.querySelector('#actK'),box=el.querySelector('#actV');
    const draw=()=>{const o=opts.find(x=>x.k===k.value);box.innerHTML='';if(!o||!o.f)return;const f=o.f,v=cur&&cur.code===f.code?cur.value:d.status[f.code];
      if(f.type==='Boolean')box.innerHTML=`<div class="field"><label for="actX">ערך</label><select id="actX"><option value="1"${v?' selected':''}>דלוק</option><option value="0"${v?'':' selected'}>כבוי</option></select></div>`;
      else if(f.type==='Enum')box.innerHTML=`<div class="field"><label for="actX">ערך</label><select id="actX">${(f.values.range||[]).map(o=>`<option value="${esc(o)}"${o===v?' selected':''}>${esc(vname(o))}</option>`).join('')}</select></div>`;
      else{const x=f.values||{},sc=+x.scale||0;box.innerHTML=`<div class="field"><label for="actX">ערך${x.unit?' ('+esc(unitHe(x.unit))+')':''}</label><input id="actX" inputmode="decimal" value="${(v??+x.min??0)/10**sc}"></div>`}};
    k.onchange=draw;draw();
    return ()=>{const o=opts.find(x=>x.k===k.value);if(!o)return null;if(o.c)return o.c;const f=o.f,x=el.querySelector('#actX');
      if(f.type==='Boolean')return{code:f.code,value:x.value==='1'};if(f.type==='Enum')return{code:f.code,value:x.value};
      const vv=f.values||{},sc=+vv.scale||0;let n=Math.round(parseFloat(x.value)*10**sc);if(isNaN(n))return null;n=Math.min(+vv.max,Math.max(+vv.min,n));return{code:f.code,value:n}}}};
}
function openSchedEdit(s,d){
  if(!d)return toast('המכשיר לא נמצא');
  const ed=actionEditor(d,s&&s.cmds&&s.cmds[0]);let days=new Set(s?s.days:[0,1,2,3,4,5,6]);
  sheet(s?'עריכת תזמון':'תזמון חדש',`<p>${esc(dname(d))}</p>
    <div class="field"><label for="sT">שעה</label><input id="sT" type="time" value="${esc(s?s.time:'07:00')}" style="font-size:1.6rem;direction:ltr;text-align:center"></div>
    <div class="field"><span style="font-weight:600" id="dL">ימים</span><div class="days" role="group" aria-labelledby="dL">${DAYS.map((x,i)=>`<button data-d="${i}" aria-pressed="${days.has(i)}" aria-label="${DAYSL[i]}">${x}</button>`).join('')}</div></div>
    <label class="row" style="background:var(--surface);border-radius:14px"><span class="grow t">פעם אחת בלבד</span><input type="checkbox" id="sO" ${s&&s.once?'checked':''} style="width:28px;height:28px;accent-color:var(--accent)"></label>
    ${ed.html}
    <div class="field"><label for="sL">תיאור (לא חובה)</label><input id="sL" value="${esc(s&&s.label!=='טיימר'?s.label||'':'')}"></div>
    <div class="err" id="sE" role="alert"></div>
    <div class="btns">${s?`<button class="btn bad" id="sD">${svg('trash')}מחיקה</button>`:''}<button class="btn pri" id="sS">שמירה</button></div>`,
  (el,close)=>{
    const get=ed.bind(el);
    el.querySelectorAll('[data-d]').forEach(b=>b.onclick=()=>{const i=+b.dataset.d;days.has(i)?days.delete(i):days.add(i);b.setAttribute('aria-pressed',days.has(i))});
    el.querySelector('#sS').onclick=async()=>{const c=get(),t=el.querySelector('#sT').value,once=el.querySelector('#sO').checked;
      if(!t)return el.querySelector('#sE').textContent='בחר שעה';if(!c)return el.querySelector('#sE').textContent='ערך לא תקין';
      let ds=[...days];if(once){const now=new Date(),[h,m]=t.split(':').map(Number),at=new Date();at.setHours(h,m,0,0);if(at<=now)at.setDate(at.getDate()+1);ds=[at.getDay()]}
      if(!ds.length)return el.querySelector('#sE').textContent='בחר לפחות יום אחד';
      try{await api('/schedules/save',{id:s?.id,device:d.id,time:t,days:ds,cmds:[c],label:el.querySelector('#sL').value.trim(),enabled:true,once});await loadSched();close();render();refreshOpen(d);toast('נשמר')}
      catch(e){el.querySelector('#sE').textContent=e.message}};
    if(s)el.querySelector('#sD').onclick=async()=>{if(!confirm('למחוק את התזמון?'))return;try{await api('/schedules/delete',{id:s.id});await loadSched();close();render();refreshOpen(d);toast('נמחק')}catch(e){toast(e.message)}};
  });
}

/* ---------- scenes (run several actions in one tap) ---------- */
function viewScenes(v){
  v.innerHTML=`<button class="btn pri wide" id="nsc">${svg('plus')}סצנה חדשה</button><div class="sec-h"><h2>סצנות</h2></div>
   ${SCENES.length?`<div class="list">${SCENES.map((s,i)=>`<div class="row"><button class="row-btn grow" data-ed="${i}" style="display:block"><span class="t">${esc(s.name)}</span><br><span class="s">${s.acts.length} פעולות</span></button><button class="btn pri" data-run="${i}" aria-label="הפעלת ${esc(s.name)}">${svg('play')}הפעל</button></div>`).join('')}</div>`
   :`<div class="empty"><b>אין סצנות</b>סצנה מפעילה כמה מכשירים בלחיצה אחת, למשל "יוצא מהבית" שמכבה הכול.</div>`}`;
  $('nsc').onclick=()=>openScene(null);
  v.querySelectorAll('[data-ed]').forEach(b=>b.onclick=()=>openScene(+b.dataset.ed));
  v.querySelectorAll('[data-run]').forEach(b=>b.onclick=()=>runScene(SCENES[+b.dataset.run],b));
}
async function runScene(s,b){
  b&&(b.disabled=true);let ok=0,bad=0;
  for(const a of s.acts){const d=DEVS.find(x=>x.id===a.device);if(!d){bad++;continue}
    try{await api('/command',{id:d.id,commands:[a.cmd]});d.status[a.cmd.code]=a.cmd.value;ok++}catch(e){bad++}}
  b&&(b.disabled=false);render();toast(bad?`בוצעו ${ok}, נכשלו ${bad}`:`"${s.name}" בוצעה`);
}
function openScene(i){
  const s=i==null?{name:'',acts:[],_new:true}:JSON.parse(JSON.stringify(SCENES[i]));const isNew=!!s._new;
  const close=sheet(isNew?'סצנה חדשה':'עריכת סצנה',`<div class="field"><label for="scN">שם הסצנה</label><input id="scN" value="${esc(s.name)}" placeholder="יוצא מהבית"></div>
    <div class="sec-h" style="margin:6px 4px 0"><h2>פעולות</h2></div><div class="list" id="scA"></div>
    <button class="btn wide" id="scAdd">${svg('plus')}הוספת פעולה</button><div class="err" id="scE" role="alert"></div>
    <div class="btns">${!isNew?`<button class="btn bad" id="scD">${svg('trash')}מחיקה</button>`:''}<button class="btn pri" id="scS">שמירה</button></div>`,(el,cl)=>{
    const draw=()=>{el.querySelector('#scA').innerHTML=s.acts.length?s.acts.map((a,k)=>{const d=DEVS.find(x=>x.id===a.device);
      return `<div class="row"><span class="grow"><span class="t">${esc(d?dname(d):'מכשיר שהוסר')}</span><br><span class="s">${esc(cmdsText({device:a.device,cmds:[a.cmd]}))}</span></span><button class="icbtn" data-rm="${k}" aria-label="הסרת פעולה">${svg('trash')}</button></div>`}).join(''):`<div class="row"><span class="s">עוד אין פעולות</span></div>`;
      el.querySelectorAll('[data-rm]').forEach(b=>b.onclick=()=>{s.acts.splice(+b.dataset.rm,1);draw()})};
    draw();
    el.querySelector('#scAdd').onclick=()=>{s.name=el.querySelector('#scN').value;pickDevice('איזה מכשיר?',d=>{const ed=actionEditor(d);
      sheet(esc(dname(d)),ed.html+`<button class="btn pri wide" id="aOk">הוספה</button>`,(e2,c2)=>{const g=ed.bind(e2);e2.querySelector('#aOk').onclick=()=>{const c=g();if(!c)return toast('ערך לא תקין');s.acts.push({device:d.id,cmd:c});c2();reopen()}})})};
    const reopen=()=>{const tmpI=i;SCENES_TMP=s;openSceneObj(tmpI)};
    el.querySelector('#scS').onclick=()=>{s.name=el.querySelector('#scN').value.trim();if(!s.name)return el.querySelector('#scE').textContent='תן שם לסצנה';if(!s.acts.length)return el.querySelector('#scE').textContent='הוסף לפחות פעולה אחת';
      delete s._new;i==null?SCENES.push(s):SCENES[i]=s;saveScenes();cl();render();toast('נשמר')};
    if(!isNew)el.querySelector('#scD').onclick=()=>{if(!confirm('למחוק את הסצנה?'))return;SCENES.splice(i,1);saveScenes();cl();render()};
  });
}
let SCENES_TMP=null;
function openSceneObj(i){const keep=SCENES_TMP;SCENES_TMP=null;if(i==null){SCENES.push(keep);openScene(SCENES.length-1);SCENES.pop()}else{const o=SCENES[i];SCENES[i]=keep;openScene(i);SCENES[i]=o}}

function showQR(uc,j){
  let stop=false;
  sheet('סריקה ב-Smart Life',`<div class="qrbox" id="qrb" role="img" aria-label="קוד QR להתחברות"></div>
    <ol><li>צלם מסך עכשיו (צד + הגברת עוצמה)</li><li>ב-Smart Life: <b>אני ← סמל הסריקה למעלה ← אלבום</b> ובחר את צילום המסך</li><li>אשר שם, ואני ממשיך לבד</li></ol>
    <div class="err" id="pE" role="alert"></div>`,(el,close)=>{
    try{const q=qrcode(0,'Q');q.addData(j.qr);q.make();el.querySelector('#qrb').innerHTML=q.createSvgTag({cellSize:6,margin:2,scalable:true})}catch(e){el.querySelector('#qrb').textContent=j.qr}
    el.querySelector('[data-x]').addEventListener('click',()=>stop=true);
  });
  const t0=Date.now();
  (async function poll(){while(!stop&&document.querySelector('#qrb')){await new Promise(r=>setTimeout(r,2500));if(stop||!document.querySelector('#qrb'))return;
    if(Date.now()-t0>170000){const p=document.querySelector('#pE');if(p)p.textContent='הקוד פג. חזור ונסה שוב.';return}
    try{const r=await api('/share/poll',{userCode:uc,token:j.token});if(r.linked){linkOk(r.key);return}}catch(e){}}})();
}

/* ---------- boot ---------- */
function applyPrefs(){document.documentElement.style.setProperty('--ts',(LS('unplug_ts')||'100')+'%')}
document.querySelectorAll('nav.bar button').forEach(b=>b.onclick=()=>{TAB=b.dataset.tab;render();if(TAB==='sched')loadSched().then(render);window.scrollTo(0,0)});
$('refBtn').onclick=()=>{loadDevices();loadSched()};
$('addBtn').onclick=openAdd;
applyPrefs();render();setTimeout(()=>{const sp=$('splash');sp.classList.add('out');setTimeout(()=>sp.remove(),450)},matchMedia('(prefers-reduced-motion: reduce)').matches?0:900);
if(CFG.key){LSset('unplug_key',CFG.key);loadDevices();loadSched()}else openConnect();
setInterval(()=>{if(document.visibilityState==='visible'&&CFG.key&&!document.querySelector('.scrim [type=range]:active'))loadDevices()},30000);
document.addEventListener('visibilitychange',()=>{if(document.visibilityState==='visible'&&CFG.key){loadDevices();loadSched()}});
</script>
</body>
