<title>Breeze</title>
<meta name="theme-color" content="#000000" media="(prefers-color-scheme: dark)">
<meta name="theme-color" content="#f2f2f7" media="(prefers-color-scheme: light)">
<style>
/* Layout: one phone screen - status bar, big tinted dial, mode rail, fan row, toggle grid, profiles. Accent shifts with the AC mode. */
:root{
  --bg:#0b0f14; --surface:#121821; --surface-2:#18202b; --line:#232d3a;
  --fg:#e9eef5; --muted:#8392a6; --accent:#5ec8ff; --accent-soft:rgba(94,200,255,.14);
  --off:#3a4554; --ok:#5fd39a; --warn:#ffb454;
  --f-body:"Heebo",system-ui,sans-serif; --f-num:"Sora","Heebo",system-ui,sans-serif;
  color-scheme:dark;
}
html,body{min-height:100%}
body{margin:0;background:var(--bg);color:var(--fg);font-family:var(--f-body);font-size:15px;-webkit-tap-highlight-color:transparent;user-select:none;-webkit-user-select:none}
*{box-sizing:border-box}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}
button:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.app{max-width:460px;margin:0 auto;padding:12px 16px 28px;display:flex;flex-direction:column;gap:18px;direction:rtl}
.top{display:flex;align-items:center;justify-content:space-between;gap:12px}
.top h1{font-size:20px;font-weight:700;margin:0;letter-spacing:.2px}
.pill{display:inline-flex;align-items:center;gap:6px;font-size:12px;color:var(--muted);background:var(--surface);border:1px solid var(--line);padding:5px 10px;border-radius:999px}
.dot{width:7px;height:7px;border-radius:50%;background:var(--warn)}
.sub{font-size:13px;color:var(--muted);margin-top:2px}

/* hero dial */
.hero{position:relative;display:grid;place-items:center;padding-block:4px}
.glow{position:absolute;inset:8% 14%;border-radius:50%;background:radial-gradient(circle,var(--accent-soft),transparent 68%);transition:background .5s;pointer-events:none}
.dial{width:min(100%,320px);aspect-ratio:1;max-width:100%;touch-action:none;position:relative}
.dial svg{width:100%;height:100%;display:block}
.track{stroke:var(--line);stroke-width:14;fill:none;stroke-linecap:round}
.val{stroke:var(--accent);stroke-width:14;fill:none;stroke-linecap:round;transition:stroke .5s}
.knob{fill:var(--fg);stroke:var(--accent);stroke-width:4;transition:stroke .5s}
.tick{stroke:var(--muted);stroke-width:2;opacity:.35}
.center{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;pointer-events:none}
.temp{font-family:var(--f-num);font-weight:200;font-size:86px;line-height:1;font-variant-numeric:tabular-nums;direction:ltr}
.temp sup{font-size:26px;font-weight:300;vertical-align:top;margin-inline-start:2px;position:relative;top:10px}
.mode-lbl{font-size:14px;color:var(--accent);font-weight:500;margin-top:6px;transition:color .5s}
.indoor{font-size:12px;color:var(--muted);margin-top:4px}
.step{position:absolute;bottom:6%;width:52px;height:52px;border-radius:50%;background:var(--surface);border:1px solid var(--line);font-size:26px;font-weight:300;display:grid;place-items:center;transition:transform .12s}
.step:active{transform:scale(.92)}
.step.minus{left:2%} .step.plus{right:2%}
.app.is-off .val,.app.is-off .knob{stroke:var(--off)}
.app.is-off .temp,.app.is-off .mode-lbl{color:var(--off)}
.app.is-off .glow{background:none}

/* power */
.power{display:flex;align-items:center;justify-content:center;gap:12px;width:100%;padding:16px;border-radius:20px;background:var(--accent);color:#06121b;font-size:17px;font-weight:700;transition:background .5s,transform .12s}
.power:active{transform:scale(.98)}
.app.is-off .power{background:var(--surface-2);color:var(--fg);border:1px solid var(--line)}
.power svg{width:22px;height:22px}

/* sections */
.sec h2{font-size:12px;font-weight:500;color:var(--muted);letter-spacing:.6px;margin:0 0 8px}
.seg{display:grid;grid-template-columns:repeat(5,1fr);gap:6px;background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:6px}
.seg.fan{grid-template-columns:repeat(4,1fr)}
.seg button{display:flex;flex-direction:column;align-items:center;gap:4px;padding:10px 2px;border-radius:13px;font-size:12.5px;color:var(--muted);transition:background .25s,color .25s}
.seg button svg{width:22px;height:22px}
.seg button[aria-pressed="true"]{background:var(--accent-soft);color:var(--accent)}
.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.tog{display:flex;flex-direction:column;align-items:flex-start;gap:8px;padding:12px;border-radius:16px;background:var(--surface);border:1px solid var(--line);text-align:start;min-width:0;transition:border-color .25s,background .25s}
.tog .t{font-size:13.5px;font-weight:500}
.tog .s{font-size:11.5px;color:var(--muted)}
.tog svg{width:20px;height:20px;color:var(--muted)}
.tog[aria-pressed="true"]{border-color:var(--accent);background:var(--accent-soft)}
.tog[aria-pressed="true"] svg{color:var(--accent)}
.tog[aria-pressed="true"] .s{color:var(--accent)}
.profiles{display:flex;gap:8px;overflow-x:auto;padding-bottom:2px;scrollbar-width:none}
.profiles::-webkit-scrollbar{display:none}
.prof{flex:0 0 auto;display:flex;flex-direction:column;gap:2px;padding:12px 14px;border-radius:16px;background:var(--surface-2);border:1px solid var(--line);text-align:start;min-width:132px}
.prof b{font-size:14px;font-weight:500}
.prof span{font-size:11.5px;color:var(--muted)}
.prof:active{transform:scale(.97)}

/* timer sheet */
.scrim{position:fixed;inset:0;background:rgba(3,6,10,.6);backdrop-filter:blur(4px);-webkit-backdrop-filter:blur(4px);display:flex;align-items:flex-end;justify-content:center;z-index:10}
.sheet{width:100%;max-width:460px;background:var(--surface);border:1px solid var(--line);border-bottom:0;border-radius:24px 24px 0 0;padding:20px 20px calc(24px + env(safe-area-inset-bottom,0px));direction:rtl;display:flex;flex-direction:column;gap:16px}
.sheet h3{margin:0;font-size:18px}
.big{font-family:var(--f-num);font-size:44px;font-weight:300;text-align:center;direction:ltr}
.big small{font-size:16px;color:var(--muted);font-family:var(--f-body)}
input[type=range]{width:100%;accent-color:var(--accent);height:28px}
.row{display:flex;gap:8px}
.btn{flex:1;padding:14px;border-radius:14px;font-weight:600;background:var(--surface-2);border:1px solid var(--line)}
.btn.pri{background:var(--accent);color:#06121b;border:0}
.toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--surface-2);border:1px solid var(--line);padding:10px 16px;border-radius:12px;font-size:13.5px;z-index:20;direction:rtl;white-space:nowrap}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
/* 6.3 sheets without scroll */
.sheet{max-height:calc(100dvh - env(safe-area-inset-top,0px) - 14px);overscroll-behavior:contain;gap:14px}
.sheet{overflow-x:hidden!important;touch-action:pan-y}
.sheet.fits{overflow-y:hidden}
.alist .grow{min-width:0}.alist b{display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.sheet .field{gap:5px}
[hidden]{display:none!important}
.seg3{display:flex;gap:6px}.seg3 .chip{flex:1;padding:10px 4px;text-align:center;white-space:nowrap}
.trow input{-webkit-appearance:none;appearance:none;display:block;box-sizing:border-box;text-align:center;max-width:100%}
.chips.one{flex-wrap:nowrap}.chips.one .chip{flex:1 1 0;min-width:0;padding:8px 2px;text-align:center}
.trow{display:flex;gap:8px}.trow .field{flex:1;min-width:0}.trow input{width:100%;min-width:0}.tpair{display:flex;flex-direction:column;gap:8px}

.brand{direction:ltr;font-weight:700;letter-spacing:-.03em;background:linear-gradient(90deg,var(--fg) 40%,var(--accent));-webkit-background-clip:text;background-clip:text;color:transparent}
/* own scroller with hidden indicator */
html,body{height:100%;overflow:hidden}
.app{height:100dvh;overflow-y:auto;overflow-x:hidden;-webkit-overflow-scrolling:touch;scrollbar-width:none;overscroll-behavior-y:contain;box-sizing:border-box}
.app::-webkit-scrollbar{display:none;width:0;height:0}
/* 3.6: full-screen scroller + floating pill bar */
.app{position:fixed;inset:0;height:auto!important;max-width:none!important;margin:0!important;padding-left:max(16px,calc((100vw - 460px)/2))!important;padding-right:max(16px,calc((100vw - 460px)/2))!important;padding-bottom:calc(120px + env(safe-area-inset-bottom,0px))!important}
.bottom-bar{left:max(14px,calc((100vw - 440px)/2))!important;right:max(14px,calc((100vw - 440px)/2))!important;bottom:max(12px,env(safe-area-inset-bottom,0px))!important;max-width:none!important;
  border-radius:999px!important;border:.5px solid rgba(255,255,255,.14)!important;padding:6px!important;gap:6px!important;
  background:rgba(40,40,44,.62)!important;backdrop-filter:blur(30px) saturate(180%)!important;-webkit-backdrop-filter:blur(30px) saturate(180%)!important;
  box-shadow:inset 0 1px 0 rgba(255,255,255,.18),0 12px 34px rgba(0,0,0,.55)!important}
.bottom-bar::after{display:none!important}
.bb{border-radius:999px!important;padding:8px 14px!important}
.bb:active{background:rgba(255,255,255,.1)!important}
@media (prefers-color-scheme:light){.bottom-bar{background:rgba(255,255,255,.72)!important;border-color:rgba(0,0,0,.06)!important;box-shadow:inset 0 1px 0 #fff,0 10px 30px rgba(0,0,0,.12)!important}}
/* 3.3: iOS standalone viewport ends above screen bottom - extend the bar below it */
.bottom-bar{overflow:visible!important}
.bottom-bar::after{content:"";position:absolute;left:0;right:0;top:100%;height:160px;background:inherit;pointer-events:none}
/* 3.4: iOS home-screen viewport shorter than the screen - stretch to the real bottom */
/* 3.7 */
.toast{top:auto!important;bottom:calc(max(12px,env(safe-area-inset-bottom,0px)) + 84px)!important}
@keyframes toastIn{from{transform:translate(-50%,16px);opacity:0}to{transform:translate(-50%,0);opacity:1}}
.air{top:-3%!important}
.air-r{right:-10px!important}.air-l{left:-10px!important}
/* 3.8: fit on one screen */
.app{gap:12px!important;padding-top:calc(env(safe-area-inset-top,0px) + 10px)!important;padding-bottom:calc(104px + env(safe-area-inset-bottom,0px))!important}
.top h1{font-size:26px}
.menu-btn,.pill.only-dot{width:36px!important;height:36px!important}
.dial{width:min(100%,330px,calc(100dvh - 400px - env(safe-area-inset-top,0px) - env(safe-area-inset-bottom,0px)))!important;min-width:170px;container-type:inline-size}
.temp{font-size:min(96px,29cqw)!important}
.temp sup{font-size:min(28px,8.5cqw)!important}
.mode-lbl{font-size:min(15px,4.8cqw)!important;margin-top:min(6px,1.5cqw)!important}
.indoor{font-size:min(13.5px,4.2cqw)!important;margin-top:min(6px,1.5cqw)!important}
.step{width:min(50px,16cqw)!important;height:min(50px,16cqw)!important}
.hero{margin-bottom:-22px!important}
.step{width:50px!important;height:50px!important;font-size:26px!important}
.power{padding:14px!important}
.turbo{width:72px!important}
.sec h2{margin-bottom:6px!important}
.prof{padding:9px 4px!important;gap:4px!important}
.prof svg{width:20px!important;height:20px!important}
.more summary{padding:13px 16px!important}
/* 4.4 */
.timer-line{display:inline-flex;align-items:center;gap:8px;padding:8px 16px!important}
.timer-line svg{width:17px;height:17px;flex:0 0 auto}
.timer-line svg:last-child{width:14px;height:14px;opacity:.6}
.timer-line b{font-family:var(--f-num);font-weight:600;font-variant-numeric:tabular-nums;direction:ltr;min-width:4.2ch;text-align:center}
.step{bottom:-2%!important}
.step.minus{left:-1%!important}.step.plus{right:-1%!important}
.hero{margin-bottom:-12px!important}
.bb{gap:8px!important;padding:8px 12px!important}
.bb-chev{display:none!important}
.bb-t b{overflow:visible!important;text-overflow:clip!important}
.bb-ic{width:32px!important;height:32px!important}
/* 4.5 */
.timer-line[hidden]{display:none!important}
.step{bottom:12%!important}
.step.minus{left:-3%!important}.step.plus{right:-3%!important}
.hero{margin-bottom:-18px!important}
/* 4.6 wheel picker */
.wheels{position:relative;display:flex;justify-content:center;align-items:center;gap:14px;height:220px;direction:ltr;margin:4px 0}
.wsel{position:absolute;left:6%;right:6%;top:88px;height:44px;border-radius:12px;background:rgba(255,255,255,.08);pointer-events:none}
.wheel{height:220px;width:110px;overflow-y:scroll;overscroll-behavior:contain;-webkit-overflow-scrolling:touch;scroll-snap-type:y mandatory;scrollbar-width:none;position:relative;z-index:1;
  -webkit-mask-image:linear-gradient(transparent,#000 35%,#000 65%,transparent);mask-image:linear-gradient(transparent,#000 35%,#000 65%,transparent);touch-action:pan-y}
.wheel::-webkit-scrollbar{display:none}
.wpad{height:88px}
.wi{height:44px;line-height:44px;text-align:center;scroll-snap-align:center;font-family:var(--f-num);font-size:22px;color:var(--muted);font-variant-numeric:tabular-nums;transition:color .15s,font-size .15s}
.wi.on{color:var(--fg);font-size:28px;font-weight:500}
.wi{scroll-snap-stop:normal}
.wsfx{font-size:15px;color:var(--muted);width:34px;z-index:1}
@media (prefers-color-scheme:light){.wsel{background:rgba(0,0,0,.06)}}
/* 4.9 */
.step{bottom:4%!important}
.step.minus{left:0!important}.step.plus{right:0!important}
/* 5.0 timer inside dial */
.dial-timer{pointer-events:auto;display:inline-flex;align-items:center;gap:5px;margin-top:min(8px,2cqw);padding:4px 10px;border-radius:999px;
  background:color-mix(in srgb,var(--accent) 16%,transparent);color:var(--accent);font-size:min(13px,4cqw);z-index:3}
.dial-timer[hidden]{display:none!important}
.dial-timer svg{width:min(14px,4.2cqw);height:min(14px,4.2cqw)}
.dial-timer b{font-family:var(--f-num);font-weight:600;font-variant-numeric:tabular-nums;direction:ltr}
.hero{margin-bottom:-4px!important}
/* 5.2 */
.app.is-off .bb-t b{color:var(--muted)}
.app.is-off .bb-dots i.on{background:var(--muted)}
/* 6.0 calm: solid fills, glass only on floating layers */
:root{--fill:#1c1c1e;--fill-2:#2c2c2e}
@media (prefers-color-scheme:light){:root{--fill:#fff;--fill-2:#e9e9ee}}
.glassy,.pick button,.menu-btn,.step,.seg,.tog,.prof,.more,.turbo,.chip,.item,.btn,.timer-line,.choice,.field input,.field select,.stat-big>div,.hint,.icon-btn{
  background:var(--fill)!important;border:0!important;box-shadow:none!important}
#toggles{background:var(--fill-2)!important;border:0!important;box-shadow:none!important}
.app.is-off .power{background:var(--fill)!important;border:0!important;box-shadow:none!important}
.power{box-shadow:none!important}
.turbo[aria-pressed="true"],.chip[aria-pressed="true"],.prof[aria-pressed="true"],.pick button[aria-pressed="true"]{background:color-mix(in srgb,var(--accent) 22%,var(--fill))!important;border:0!important}
.air svg{background:transparent!important;border:0!important;box-shadow:none!important;padding:4px!important;width:26px!important;height:26px!important}
.air[aria-pressed="true"] svg{background:transparent!important;color:var(--accent)}
.pill.only-dot{background:transparent!important;border:0!important;box-shadow:none!important;width:20px!important;height:20px!important}
.pill{background:var(--fill)!important;border:0!important;box-shadow:none!important}
.top-r{gap:4px}
.more .chip,.sheet .item,.sheet .pick button,.sheet .btn:not(.pri),.sheet .chip{background:var(--fill-2)!important}

.air{top:auto!important;bottom:calc(4% + min(25px,8cqw))!important;transform:translateY(50%);flex-direction:row!important;gap:6px!important;
  padding:8px 12px 8px 10px!important;border-radius:999px!important;background:var(--fill)!important;font-size:13px!important;min-width:0!important}
.air svg{width:18px!important;height:18px!important;padding:0!important}
.air-r{right:auto!important;left:calc(50% + 5px)!important}
.air-l{left:auto!important;right:calc(50% + 5px)!important}
.air[aria-pressed="true"]{background:color-mix(in srgb,var(--accent) 22%,var(--fill))!important}

.ctl-row .air{position:static!important;transform:none!important;flex:0 1 auto}
.hero{margin-bottom:-38px!important}

/* ---------- capabilities from Tuya spec ---------- */
function buildCaps(dev){
  const F={};(dev.functions||[]).forEach(f=>F[f.code]=f);
  const R={};(dev.statusRange||[]).forEach(f=>R[f.code]=f);
  const pick=codes=>codes.find(c=>F[c]);
  const c={used:new Set(),tog:{}};
  const use=k=>{if(k)c.used.add(k);return k};
  c.power=use(pick(['switch','power','switch_1']));
  const tc=use(pick(['temp_set','temp_set_c','set_temp']));
  if(tc){const v=F[tc].values||{};const sc=+v.scale||0;c.temp={code:tc,scale:sc,min:(+v.min||160)/10**sc,max:(+v.max||300)/10**sc,step:Math.max(1,(+v.step||1)/10**sc)};
    if(c.temp.min<10||c.temp.max>40){c.temp.min=16;c.temp.max=30;}}
  c.indoor=['temp_current','temp_indoor','current_temp'].find(k=>k in (dev.status||{})||R[k]);
  const ic=c.indoor&&(R[c.indoor]||F[c.indoor]);c.indoorScale=ic&&ic.values&&+ic.values.scale||0;
  const mc=use(pick(['mode','work_mode','mode_select']));
  if(mc){const range=(F[mc].values||{}).range||[];c.mode={code:mc,toRaw:{},fromRaw:{}};
    range.forEach(r=>{const m=MODES.find(m=>m.raw.includes(String(r).toLowerCase()));if(m&&!c.mode.toRaw[m.id]){c.mode.toRaw[m.id]=r;c.mode.fromRaw[r]=m.id}});}
  const fc=use(pick(['fan_speed_enum','windspeed','fan_speed','wind_speed','fan_level']));
  if(fc&&F[fc].type==='Enum'){c.fan={code:fc,opts:((F[fc].values||{}).range||[]).map(r=>({raw:r,label:FAN_LBL[String(r).toLowerCase()]||(/\d/.test(r)?'רמה '+String(r).replace(/\D/g,''):r)}))};}
  TOGS.forEach(t=>{const k=pick(t.codes);if(k&&F[k].type==='Boolean'){c.tog[t.id]=use(k)}});
  const qm=pick(['mute','silent','silence','mute_switch']),qb=pick(['beep','buzzer','sound','voice','beep_switch','buzzer_switch']);
  if(qm&&F[qm].type==='Boolean')c.quiet={code:use(qm),inv:false};else if(qb&&F[qb].type==='Boolean')c.quiet={code:use(qb),inv:true};
  const vg=pick(['gear_vertical','vertical_gear','angle_vertical','vertical_position']);
  if(vg&&F[vg].type==='Enum'){use(vg);c.vane={code:vg,opts:((F[vg].values||{}).range||[])}}
  const tm=pick(['countdown_set','countdown','timer','countdown_1']);
  if(tm){use(tm);const f=F[tm];c.timer={code:tm,type:f.type,values:f.values||{}};c.tog.timer=tm;}
  c.timerLeft=['countdown_left','timer_left'].find(k=>k in (dev.status||{}));
  c.extra=(dev.functions||[]).filter(f=>!c.used.has(f.code)&&f.type==='Boolean').map(f=>{const x=EXTRA_HE[String(f.code).toLowerCase()];return{code:f.code,name:x?x[0]:(f.name||f.code),ic:x&&x[1]}});
  return c;
}
function readStatus(st){
  if(!CAP)return;
  const g=k=>k&&k in st?st[k]:undefined;
  if(CAP.power&&g(CAP.power)!==undefined)S.power=!!st[CAP.power];
  if(CAP.temp&&g(CAP.temp.code)!==undefined)S.temp=st[CAP.temp.code]/10**CAP.temp.scale;
  if(CAP.indoor&&g(CAP.indoor)!==undefined)S.indoor=Math.round(st[CAP.indoor]/10**CAP.indoorScale);
  if(CAP.mode&&g(CAP.mode.code)!==undefined)S.mode=CAP.mode.fromRaw[st[CAP.mode.code]]||S.mode;
  if(CAP.fan&&g(CAP.fan.code)!==undefined)S.fan=st[CAP.fan.code];
  Object.entries(CAP.tog).forEach(([id,k])=>{if(id!=='timer'&&g(k)!==undefined)S[id]=!!st[k]});
  CAP.extra.forEach(x=>{if(g(x.code)!==undefined)S['x_'+x.code]=!!st[x.code]});
  if(CAP.vane&&g(CAP.vane.code)!==undefined)S.vane=st[CAP.vane.code];
  if(CAP.quiet&&g(CAP.quiet.code)!==undefined)S.quiet=CAP.quiet.inv?!st[CAP.quiet.code]:!!st[CAP.quiet.code];
}
function fanRawFor(want){ // map a generic speed ('low','mid',...) to this device's value
  if(!CAP||!CAP.fan)return want;
  const o=CAP.fan.opts.find(o=>String(o.raw).toLowerCase()===want)||CAP.fan.opts.find(o=>FAN_LBL[String(o.raw).toLowerCase()]===FAN_LBL[want]);
  if(o)return o.raw;
  const lv=CAP.fan.opts.filter(o=>String(o.raw).toLowerCase()!=='auto');if(!lv.length)return undefined;
  if(want==='low')return lv[0].raw;if(want==='high')return lv[lv.length-1].raw;if(want==='mid')return lv[Math.floor((lv.length-1)/2)].raw;
  return undefined;
}
function toCommands(p){
  const out=[];if(!CAP)return out;
  if('power' in p&&CAP.power)out.push({code:CAP.power,value:!!p.power});
  if('mode' in p&&CAP.mode&&CAP.mode.toRaw[p.mode]!==undefined)out.push({code:CAP.mode.code,value:CAP.mode.toRaw[p.mode]});
  if('temp' in p&&CAP.temp)out.push({code:CAP.temp.code,value:Math.round(p.temp*10**CAP.temp.scale)});
  if('fan' in p&&CAP.fan){const r=fanRawFor(String(p.fan).toLowerCase())??p.fan;if(CAP.fan.opts.some(o=>o.raw===r))out.push({code:CAP.fan.code,value:r})}
  Object.entries(CAP.tog).forEach(([id,k])=>{if(id!=='timer'&&id in p)out.push({code:k,value:!!p[id]})});
  if('vane' in p&&CAP.vane)out.push({code:CAP.vane.code,value:p.vane});
  if('quiet' in p&&CAP.quiet)out.unshift({code:CAP.quiet.code,value:CAP.quiet.inv?!p.quiet:!!p.quiet});
  Object.keys(p).filter(k=>k.startsWith('x_')).forEach(k=>out.push({code:k.slice(2),value:!!p[k]}));
  return out;
}
function timerCommand(hours){ // hours=0 cancels
  const t=CAP&&CAP.timer;if(!t)return null;
  if(t.type==='Enum'){const range=t.values.range||[];if(!hours)return{code:t.code,value:range.includes('cancel')?'cancel':range[0]};
    let best=range[0],bd=1e9;range.forEach(r=>{const h=parseFloat(r);if(!isNaN(h)&&Math.abs(h-hours)<bd){bd=Math.abs(h-hours);best=r}});return{code:t.code,value:best}}
  if(t.type==='Integer'){const unit=String(t.values.unit||'').toLowerCase();const sc=+t.values.scale||0;
    let v=unit.startsWith('h')?hours:hours*60;v=Math.round(v*10**sc);const mx=+t.values.max||v;return{code:t.code,value:Math.min(v,mx)}}
  return null;
}

  let j;try{j=await r.json()}catch(e){throw new Error('השרת לא ענה ('+r.status+')')}
  if(r.status===401){logout(true);throw new Error(j.error||'החיבור פג')}
  if(!j.ok)throw new Error(j.error||'שגיאה');
  return j;
}

let PENDING=0,sending=0,queue={},qT;
function send(patch,immediate){
  if('power' in patch&&S.timerAt&&S.timerAt>Date.now()&&patch.power===S.timerPower){setTimeout(()=>setTimer(0),0)}
  if('fan' in patch&&CAP&&CAP.fan){const r=fanRawFor(String(patch.fan).toLowerCase());if(r!==undefined)patch.fan=r}
  const prev=Object.assign({},S);Object.assign(S,patch);render();
  if(!CAP){saveDemo();return}
  Object.assign(queue,patch);clearTimeout(qT);
  qT=setTimeout(flush,immediate?0:450);
  function flush(){const p=queue;queue={};const cmds=toCommands(p);if(!cmds.length)return;
    sending++;$('app').classList.add('busy');
    PENDING=1;$('app').classList.add('pending');
    api('/command',{id:DEV.id,commands:cmds}).then(()=>{PENDING=Date.now()+1500;setTimeout(refresh,1800)})
      .catch(e=>{PENDING=0;$('app').classList.remove('pending');Object.assign(S,prev);render();toast(netMsg(e))})
      .finally(()=>{sending--;if(!sending)$('app').classList.remove('busy')});
  }
}

/* ---------- dial ---------- */
const C=150,R=133,A0=135,SPAN=270;
const tmin=()=>CAP&&CAP.temp?CAP.temp.min:16, tmax=()=>CAP&&CAP.temp?CAP.temp.max:30, tstep=()=>CAP&&CAP.temp?CAP.temp.step:1;
const pt=(deg,r=R)=>{const a=deg*Math.PI/180;return[C+r*Math.cos(a),C+r*Math.sin(a)]};
const arc=(a1,a2)=>{const[x1,y1]=pt(a1),[x2,y2]=pt(a2);return`M${x1} ${y1}A${R} ${R} 0 ${a2-a1>180?1:0} 1 ${x2} ${y2}`};
$('track').setAttribute('d',arc(A0,A0+SPAN));
function drawTicks(){const n=Math.round((tmax()-tmin())/tstep());$('ticks').innerHTML=Array.from({length:n+1},(_,i)=>{if(i%2)return'';const d=A0+SPAN*i/n,[x1,y1]=pt(d,R-20),[x2,y2]=pt(d,R-(i%2?24:28));return`<line class="tick" x1="${x1}" y1="${y1}" x2="${x2}" y2="${y2}"/>`}).join('')}
function tempFromPointer(e){const r=$('dial').getBoundingClientRect();const x=(e.clientX-r.left)/r.width*300,y=(e.clientY-r.top)/r.height*300;
  let a=(Math.atan2(y-C,x-C)*180/Math.PI-A0+720)%360;if(a>SPAN)a=a>SPAN+45?0:SPAN;
  const st=tstep();return Math.round((tmin()+(a/SPAN)*(tmax()-tmin()))/st)*st}

const KH=$('knobHit');

['pointerup','pointercancel'].forEach(ev=>KH.addEventListener(ev,()=>{if(dragging){dragging=false;send({temp:S.temp},true)}}));

(function fitDial(){

    }
    const app=document.getElementById('app');app.style.setProperty('gap','12px','important');
    const left=bar.getBoundingClientRect().top-12-sum.getBoundingClientRect().bottom;
    if(left>4)app.style.setProperty('gap',Math.min(30,12+left/5)+'px','important');
    app.scrollTop=more.open?app.scrollTop:0;
    app.style.setProperty('overflow-y',(more.open||app.scrollHeight>app.clientHeight+1)?'auto':'hidden','important');
  };
  more.addEventListener('toggle',()=>setTimeout(fit,30));
  document.addEventListener('touchmove',e=>{if(e.target.closest('.scrim'))return;
    const app=document.getElementById('app');if(app.style.getPropertyValue('overflow-y')==='hidden')e.preventDefault()},{passive:false});
  addEventListener('load',fit);addEventListener('resize',()=>setTimeout(fit,50));setTimeout(fit,60);setTimeout(fit,600);
  window.__fitDial=fit;
})();
(function fixGap(){
  const set=()=>{let g=0;const sa=window.navigator.standalone||matchMedia('(display-mode: standalone)').matches;
    if(sa&&screen.height>innerHeight&&Math.abs(screen.width-innerWidth)<2)g=Math.min(120,screen.height-innerHeight);
    document.documentElement.style.setProperty('--vgap','0px')};
  set();addEventListener('resize',set);addEventListener('orientationchange',()=>setTimeout(set,300));
})();
(function autoUpdate(){
  const cur=(document.querySelector('meta[name="app-version"]')||{}).content||'0';
  const chk=()=>fetch(location.pathname+'?v='+Date.now(),{cache:'no-store'}).then(r=>r.text()).then(t=>{
    const m=t.match(/name="app-version" content="([\d.]+)"/);if(!m||m[1]===cur)return;
    let k='kor_upd_'+m[1];try{if(sessionStorage.getItem(k))return;sessionStorage.setItem(k,'1')}catch(e){}
    location.replace(location.pathname+'?v='+m[1]);
  }).catch(()=>{});
  chk();document.addEventListener('visibilitychange',()=>{if(document.visibilityState==='visible')chk()});
})();
if(linked){try{const c=JSON.parse(localStorage.getItem('kor_last')||'null');if(c&&(!CFG.dev||c.id===CFG.dev)){DEV=c;CAP=buildCaps(c);readStatus(c.status||{})}}catch(e){}}
buildControls();render();
if(linked){loadDevices();startPoll()}
})();
</script>
